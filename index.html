<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Мини-CRM байера</title>
  <!-- Библиотека Telegram: даёт цвета темы, главную кнопку, кнопку «Назад» и вибрацию -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Шапка: заголовок экрана и кнопка «Сводка» -->
  <header class="top">
    <button id="backBtn" class="icon-btn" data-act="back" aria-label="Назад" hidden>
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 id="title">Сегодня</h1>
    <span id="demoBadge" class="badge" hidden>демо</span>
    <button id="sumBtn" class="icon-btn" data-act="summary" aria-label="Сводка">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-8"/></svg>
    </button>
  </header>

  <!-- Сюда app.js рисует текущий экран -->
  <main id="view"></main>

  <!-- Главная кнопка для браузера. Внутри Telegram вместо неё — родная MainButton -->
  <button id="mainBtn" class="main-btn" hidden></button>

  <!-- Нижнее меню из 4 вкладок -->
  <nav class="tabs" id="tabs">
    <button data-act="tab" data-tab="today">
      <svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>Сегодня<span class="count" id="cntToday"></span></button>
    <button data-act="tab" data-tab="orders">
      <svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9"/></svg>Заказы</button>
    <button data-act="tab" data-tab="new" class="plus-tab" aria-label="Новый заказ">
      <span class="plus-circle"><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>Новый</button>
    <button data-act="tab" data-tab="clients">
      <svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg>Клиенты</button>
  </nav>

  <!-- Всплывающая снизу панель (оплата, выбор статуса, трек-номер) -->
  <div id="sheetBg" class="sheet-bg" data-act="sheetClose" hidden></div>
  <div id="sheet" class="sheet" hidden></div>

  <!-- Короткие уведомления («Сохранено ✅») -->
  <div id="toast" class="toast" hidden></div>

  <!-- demo.js — выдуманные данные, app.js — само приложение -->
  <script src="demo.js"></script>
  <script src="app.js"></script>
</body>
</html>
